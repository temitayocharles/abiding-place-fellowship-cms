<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Content Editor · Abiding Place Fellowship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script defer src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <style>
    :root { --primary:#2563EB; --primary-dark:#1E40AF; --bg:#F8FAFC; --text:#0F172A; --body:'DM Sans',sans-serif; --heading:'Space Grotesk',sans-serif; }
    html,body,#root { min-height:100%; margin:0; font-family:var(--body); background:var(--bg); color:var(--text); }
    :root { --colorPrimary:#2563EB!important; --colorPrimaryDark:#1E40AF!important; --colorSuccess:#2563EB!important; --colorTeal:#2563EB!important; --colorGreen:#2563EB!important; }
    .ap-loading { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; text-align:center; padding:2rem; }
    .ap-loading svg { width:58px; fill:#fff; }
    .ap-loading h1 { font:700 1.6rem/1.2 var(--heading); margin:1rem 0 .35rem; }
    .ap-loading p { margin:0; opacity:.82; }
    .ap-help { position:fixed; right:1rem; bottom:1rem; z-index:30; background:#fff; color:var(--primary-dark); text-decoration:none; font-weight:700; padding:.7rem 1rem; border-radius:.7rem; box-shadow:0 8px 24px rgba(15,23,42,.18); }
    *:focus-visible { outline:3px solid #60A5FA!important; outline-offset:2px!important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="ap-loading" id="ap-loading" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.5 2L2 7v13h20V7L12.5 2h-1zM20 18H4V8l8.5 4.5L20 8v10z"/></svg>
    <h1>Abiding Place Fellowship</h1>
    <p>Opening the website editor…</p>
  </div>
  <a class="ap-help" href="help.html" target="_blank" rel="noopener">Editor Help</a>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      function removeLoader() {
        var loader = document.getElementById('ap-loading');
        if (loader) loader.remove();
      }
      var attempts = 0;
      var timer = setInterval(function () {
        attempts += 1;
        if (window.CMS || attempts > 30) {
          clearInterval(timer);
          removeLoader();
        }
      }, 100);

      function configureIdentity() {
        if (!window.netlifyIdentity) {
          setTimeout(configureIdentity, 100);
          return;
        }
        window.netlifyIdentity.on('init', function (user) {
          if (!user && /invite_token|confirmation_token|recovery_token/.test(window.location.hash)) {
            window.netlifyIdentity.open();
          }
        });
        window.netlifyIdentity.on('login', function () {
          window.netlifyIdentity.close();
          window.location.href = '/admin/';
        });
      }
      configureIdentity();
      setTimeout(removeLoader, 4000);
    });
  </script>
</body>
</html>
