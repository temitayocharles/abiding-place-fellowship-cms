name: Netlify preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: abidingplace-netlify-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify preview artifacts
        run: |
          test -f public/index.html
          test -f public/admin/index.html
          test -f public/admin/config.yml
          test -f public/admin/help.html
          test -f public/content/site-data.json
      - name: Create temporary live Netlify preview
        run: |
          npx --yes netlify-cli@latest deploy \
            --allow-anonymous \
            --dir=public \
            --json > /tmp/netlify-preview.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/netlify-preview.json', 'utf8'));

          const describe = (value, key = '') => {
            if (/token|secret|password|authorization/i.test(key)) return '[redacted]';
            if (typeof value === 'string') {
              return /^https?:\/\//.test(value) ? value : `[string:${value.length}]`;
            }
            if (Array.isArray(value)) return value.map((entry) => describe(entry));
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.entries(value).map(([childKey, childValue]) => [childKey, describe(childValue, childKey)]));
            }
            return value;
          };
          console.log(`Anonymous deploy response shape: ${JSON.stringify(describe(result))}`);

          const preferredKeys = [
            'deploy_ssl_url', 'deploy_url', 'deployUrl', 'deployURL',
            'ssl_url', 'sslUrl', 'site_url', 'siteUrl', 'url'
          ];
          let url;
          for (const key of preferredKeys) {
            if (typeof result[key] === 'string' && result[key].includes('netlify')) {
              url = result[key];
              break;
            }
          }
          function inspect(value, key = '') {
            if (url || /claim/i.test(key)) return;
            if (typeof value === 'string' && /^https?:\/\//.test(value) && value.includes('netlify')) {
              url = value;
              return;
            }
            if (Array.isArray(value)) value.forEach((entry) => inspect(entry));
            else if (value && typeof value === 'object') {
              Object.entries(value).forEach(([childKey, childValue]) => inspect(childValue, childKey));
            }
          }
          inspect(result);
          if (!url) throw new Error('Netlify did not return a discoverable preview URL');
          url = url.replace(/^http:/, 'https:').replace(/\/$/, '');
          fs.appendFileSync(process.env.GITHUB_ENV, `PREVIEW_URL=${url}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Temporary Netlify preview\n\n${url}\n`);
          console.log(`Temporary preview URL: ${url}`);
          NODE
      - name: Verify live pages, CMS assets, redirects, and headers
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-checks
          USER_AGENT='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36'

          fetch_page() {
            local path="$1"
            local output="$2"
            local headers="${output}.headers"
            echo "Checking $path"
            local code
            code="$(curl --retry 10 --retry-delay 2 --retry-all-errors -sS -L -A "$USER_AGENT" -D "$headers" -o "$output" -w '%{http_code}' "$PREVIEW_URL$path")"
            echo "$path -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo 'Response headers:'
              sed -n '1,40p' "$headers"
              echo 'Response body preview:'
              head -c 1000 "$output" || true
              echo
              return 1
            fi
            test -s "$output"
          }

          fetch_page / /tmp/live-checks/home.html
          fetch_page /about.html /tmp/live-checks/about.html
          fetch_page /ministries.html /tmp/live-checks/ministries.html
          fetch_page /events.html /tmp/live-checks/events.html
          fetch_page /contact.html /tmp/live-checks/contact.html
          fetch_page /admin/ /tmp/live-checks/admin.html
          fetch_page /admin/help.html /tmp/live-checks/help.html
          fetch_page /admin/config.yml /tmp/live-checks/config.yml
          fetch_page /content/site-data.json /tmp/live-checks/site-data.json

          grep -q 'Welcome to Abiding Place' /tmp/live-checks/home.html
          grep -q 'Regular Weekly Gatherings' /tmp/live-checks/events.html
          grep -q 'Mel Lloyd Centre' /tmp/live-checks/contact.html
          grep -q 'Content Editor' /tmp/live-checks/admin.html
          grep -q 'Website Editor Help' /tmp/live-checks/help.html
          grep -q 'name: git-gateway' /tmp/live-checks/config.yml
          grep -q 'https://abidingplace.netlify.app' /tmp/live-checks/config.yml

          node - <<'NODE'
          const data = require('/tmp/live-checks/site-data.json');
          if (!data.contact || data.contact.venue !== 'Mel Lloyd Centre') {
            throw new Error('Generated contact venue is incorrect');
          }
          if (!Array.isArray(data.gatherings) || data.gatherings.length < 3) {
            throw new Error('Generated weekly gatherings are incomplete');
          }
          NODE

          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSI -A "$USER_AGENT" "$PREVIEW_URL/admin/" | tr -d '\r' > /tmp/live-checks/admin.headers
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSI -A "$USER_AGENT" "$PREVIEW_URL/" | tr -d '\r' > /tmp/live-checks/home.headers
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSI -A "$USER_AGENT" "$PREVIEW_URL/admin/config.yml" | tr -d '\r' > /tmp/live-checks/config.headers

          grep -qi '^x-robots-tag: noindex, nofollow' /tmp/live-checks/admin.headers
          grep -qi '^x-content-type-options: nosniff' /tmp/live-checks/home.headers
          grep -qi '^cache-control: no-cache' /tmp/live-checks/config.headers

          echo 'All live Netlify preview checks passed.'
