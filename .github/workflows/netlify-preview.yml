name: Netlify preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: abidingplace-netlify-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify preview artifacts
        run: |
          test -f public/index.html
          test -f public/admin/index.html
          test -f public/admin/config.yml
          test -f public/admin/help.html
          test -f public/content/site-data.json
      - name: Create temporary live Netlify preview
        run: |
          npx --yes netlify-cli@latest deploy \
            --allow-anonymous \
            --dir=public \
            --json > /tmp/netlify-preview.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/netlify-preview.json', 'utf8'));
          const url = String(result.site_url || result.deploy_url || result.url || '')
            .replace(/^http:/, 'https:')
            .replace(/\/$/, '');
          const password = String(result.password || '');
          if (!url || !url.includes('netlify')) throw new Error('Netlify did not return a preview URL');
          if (!password) throw new Error('Netlify did not return the anonymous preview password');
          console.log(`::add-mask::${password}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PREVIEW_URL=${url}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PREVIEW_PASSWORD=${password}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Protected temporary Netlify preview\n\n${url}\n`);
          console.log(`Protected temporary preview created: ${url}`);
          NODE
      - name: Verify authenticated live pages, CMS assets, and headers
        run: |
          npm install --no-save --ignore-scripts playwright-core@latest
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo 'A Chromium-compatible browser is not installed on the runner.' >&2
            exit 1
          fi
          export CHROME_PATH
          node - <<'NODE'
          const { chromium } = require('playwright-core');

          const base = process.env.PREVIEW_URL;
          const password = process.env.PREVIEW_PASSWORD;
          const browserPath = process.env.CHROME_PATH;
          const requiredPages = [
            ['/', 'Welcome to Abiding Place'],
            ['/about.html', 'Our Story, Leadership and Faith'],
            ['/ministries.html', 'Ministries Rooted in Relationship'],
            ['/events.html', 'Regular Weekly Gatherings'],
            ['/contact.html', 'Mel Lloyd Centre'],
            ['/admin/', 'Content Editor'],
            ['/admin/help.html', 'Website Editor Help'],
            ['/admin/config.yml', 'name: git-gateway'],
            ['/content/site-data.json', 'Mel Lloyd Centre'],
          ];

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: browserPath,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            try {
              const context = await browser.newContext();
              const page = await context.newPage();
              await page.goto(base, { waitUntil: 'domcontentloaded', timeout: 30000 });

              const passwordInput = page.locator('input[type="password"]');
              if (await passwordInput.count()) {
                await passwordInput.fill(password);
                const submit = page.locator('button[type="submit"], input[type="submit"], button').first();
                if (!(await submit.count())) throw new Error('Password page has no submit control');
                await Promise.all([
                  page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 30000 }).catch(() => null),
                  submit.click(),
                ]);
              }

              if (await page.locator('input[type="password"]').count()) {
                throw new Error('Anonymous preview password was not accepted');
              }

              const responses = new Map();
              for (const [path, expectedText] of requiredPages) {
                const response = await context.request.get(`${base}${path}`, {
                  failOnStatusCode: false,
                  timeout: 30000,
                  maxRedirects: 5,
                });
                const status = response.status();
                const body = await response.text();
                console.log(`${path} -> HTTP ${status}`);
                if (status !== 200) throw new Error(`${path} returned HTTP ${status}`);
                if (!body.includes(expectedText)) throw new Error(`${path} is missing expected content: ${expectedText}`);
                responses.set(path, { headers: response.headers(), body });
              }

              const siteData = JSON.parse(responses.get('/content/site-data.json').body);
              if (!siteData.contact || siteData.contact.venue !== 'Mel Lloyd Centre') {
                throw new Error('Generated contact venue is incorrect');
              }
              if (!Array.isArray(siteData.gatherings) || siteData.gatherings.length < 3) {
                throw new Error('Generated weekly gatherings are incomplete');
              }

              const adminHeaders = responses.get('/admin/').headers;
              const homeHeaders = responses.get('/').headers;
              const configHeaders = responses.get('/admin/config.yml').headers;
              if (!String(adminHeaders['x-robots-tag'] || '').toLowerCase().includes('noindex')) {
                throw new Error('Admin route is missing X-Robots-Tag noindex protection');
              }
              if (String(homeHeaders['x-content-type-options'] || '').toLowerCase() !== 'nosniff') {
                throw new Error('Public pages are missing X-Content-Type-Options: nosniff');
              }
              if (!String(configHeaders['cache-control'] || '').toLowerCase().includes('no-cache')) {
                throw new Error('CMS configuration is missing no-cache protection');
              }

              console.log('All authenticated live Netlify preview checks passed.');
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error.message || error);
            process.exit(1);
          });
          NODE
