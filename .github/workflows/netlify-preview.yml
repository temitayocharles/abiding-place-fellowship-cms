name: Netlify preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: abidingplace-netlify-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify preview artifacts
        run: |
          test -f public/index.html
          test -f public/admin/index.html
          test -f public/admin/config.yml
          test -f public/admin/help.html
          test -f public/manage.html
          test ! -f public/admin.html
          test -f public/content/site-data.json
          test -f public/_headers
          test -f public/_redirects
      - name: Create temporary live Netlify preview
        run: |
          npx --yes netlify-cli@latest deploy \
            --allow-anonymous \
            --dir=public \
            --json > /tmp/netlify-preview.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/netlify-preview.json', 'utf8'));
          const url = String(result.site_url || result.deploy_url || result.url || '')
            .replace(/^http:/, 'https:')
            .replace(/\/$/, '');
          const password = String(result.password || '');
          if (!url || !url.includes('netlify')) throw new Error('Netlify did not return a preview URL');
          if (!password) throw new Error('Netlify did not return the anonymous preview password');
          console.log(`::add-mask::${password}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PREVIEW_URL=${url}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PREVIEW_PASSWORD=${password}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Protected temporary Netlify preview\n\n${url}\n`);
          console.log(`Protected temporary preview created: ${url}`);
          NODE
      - name: Verify authenticated live pages and CMS assets
        run: |
          npm install --no-save --ignore-scripts playwright-core@latest
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo 'A Chromium-compatible browser is not installed on the runner.' >&2
            exit 1
          fi
          export CHROME_PATH
          node scripts/validate-live-preview.js
      - name: Upload verified production build
        uses: actions/upload-artifact@v4
        with:
          name: abidingplace-public
          path: public
          if-no-files-found: error
          retention-days: 3
      - name: Deploy verified commit to canonical Netlify project
        run: |
          npx -y @netlify/mcp@latest \
            --site-id 85526be1-1a57-48eb-a6ec-795115effb8b \
            --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..hfdWNLW7XCbme0Mv.-7W8L0zotHqu7XhHEIX8JfMskM5Daj9_6lc1OIl4AePwhwcEWg712Ivi6-TuT1MSMVtm6dD8vqaDa47NuB3UJ6Vd8bM_wjvkjHGqc0VddGT43JMsxW1V9D4hfAjrW2-TMegOeGXtcXKEEXcq8aPyKWzs-v_i_zdepSw_1UJ_3GNPmt0BtZdBHi57CLmT-uyM84QeWiADBwmTuNVJUC-NbDeclLsH0qloXGT_wGM0Sz1l0eC4l-kRcHWeVU_yoTbbYP3FU_R2JBwzCdTxDxRDsMGi0tPe7wP-jbS2dKWW6njh3I5OJd5gXZPgDpCcdnMwpZN4PyhTXf5atQlP8_MDqUIqPkJvjzW0tDpM7ud7rbGeKRZ9Jq7k1tDhaUXHdz3ITQ41SKTi.DXGyz3h4kJEkMbMj4oaHmA"
      - name: Verify canonical production routes, content, headers, and CMS authentication service
        run: |
          set -euo pipefail
          BASE='https://abidingplace.netlify.app'
          check_body() {
            path="$1"; expected="$2"
            code="$(curl --retry 10 --retry-delay 2 --retry-all-errors -sS -L -o /tmp/body -w '%{http_code}' "$BASE$path")"
            echo "$path -> HTTP $code"
            test "$code" = '200'
            grep -Fq "$expected" /tmp/body
          }
          check_body '/' 'Welcome to Abiding Place'
          check_body '/about.html' 'Our Story, Leadership and Faith'
          check_body '/ministries.html' 'Ministries Rooted in Relationship'
          check_body '/events.html' 'Regular Weekly Gatherings'
          check_body '/contact.html' 'Mel Lloyd Centre'
          check_body '/admin' 'Content Editor · Abiding Place Fellowship'
          check_body '/admin/' 'Content Editor · Abiding Place Fellowship'
          check_body '/admin/help.html' 'Website Editor Help'
          check_body '/manage.html' 'Website Administration · Abiding Place Fellowship'
          check_body '/admin/config.yml' 'name: git-gateway'
          check_body '/content/site-data.json' 'Mel Lloyd Centre'

          curl -fsSI "$BASE/admin/" | tr -d '\r' > /tmp/admin.headers
          curl -fsSI "$BASE/" | tr -d '\r' > /tmp/home.headers
          curl -fsSI "$BASE/admin/config.yml" | tr -d '\r' > /tmp/config.headers
          grep -qi '^x-robots-tag:.*noindex' /tmp/admin.headers
          grep -qi '^x-content-type-options: *nosniff' /tmp/home.headers
          grep -Eqi '^cache-control:.*(no-store|no-cache)' /tmp/config.headers

          test "$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/editor.html")" = '301'

          identity_code="$(curl -sS -o /tmp/identity.json -w '%{http_code}' "$BASE/.netlify/identity/settings")"
          echo "Netlify Identity settings -> HTTP $identity_code"
          cat /tmp/identity.json
          test "$identity_code" = '200'
          grep -Eq '"external"|"disable_signup"|"site_url"' /tmp/identity.json
