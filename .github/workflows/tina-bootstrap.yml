name: Tina bootstrap

on:
  push:
    branches:
      - feature/tinacms-migration

permissions:
  contents: write

jobs:
  generate-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feature/tinacms-migration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and update package lock
        run: npm install --ignore-scripts

      - name: Generate Tina schema lock
        shell: bash
        run: |
          set +e
          timeout 90s npx tinacms dev --noWatch --noTelemetry > tina-bootstrap.log 2>&1
          status=$?
          set -e
          cat tina-bootstrap.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          test -s tina/tina-lock.json

      - name: Validate existing website build
        run: npm test

      - name: Commit generated lockfiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f package-lock.json tina/tina-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git commit -m "Add generated TinaCMS lockfiles"
          git push origin HEAD:feature/tinacms-migration
