name: Tina bootstrap

on:
  push:
    branches:
      - feature/tinacms-migration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and update package lock
        run: npm install --ignore-scripts

      - name: Generate Tina schema lock
        shell: bash
        run: |
          set +e
          timeout 90s npx tinacms dev --noWatch --noTelemetry > tina-bootstrap.log 2>&1
          status=$?
          set -e
          cat tina-bootstrap.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          test -s tina/tina-lock.json

      - name: Validate existing website build
        run: npm test

      - name: Upload generated lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: tina-lockfiles
          path: |
            package-lock.json
            tina/tina-lock.json
          if-no-files-found: error
          retention-days: 3
