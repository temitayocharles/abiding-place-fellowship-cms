name: Verify production CMS authentication

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production CMS services
        run: |
          set -euo pipefail
          BASE='https://abidingplace.netlify.app'

          identity_code="$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS -o /tmp/identity.json -w '%{http_code}' "$BASE/.netlify/identity/settings")"
          echo "Identity settings -> HTTP $identity_code"
          cat /tmp/identity.json
          test "$identity_code" = '200'
          grep -Eq '"site_url"|"disable_signup"|"external"' /tmp/identity.json

          admin_code="$(curl --retry 5 --retry-delay 2 --retry-all-errors -sS -L -o /tmp/admin.html -w '%{http_code}' "$BASE/admin/")"
          echo "CMS editor -> HTTP $admin_code"
          test "$admin_code" = '200'
          grep -Fq 'Content Editor · Abiding Place Fellowship' /tmp/admin.html
          grep -Eq 'decap-cms|netlify-cms' /tmp/admin.html

          config_code="$(curl -sS -o /tmp/config.yml -w '%{http_code}' "$BASE/admin/config.yml")"
          echo "CMS config -> HTTP $config_code"
          test "$config_code" = '200'
          grep -Fq 'name: git-gateway' /tmp/config.yml
          grep -Fq 'branch: main' /tmp/config.yml

          git_code="$(curl -sS -o /tmp/git-settings -w '%{http_code}' "$BASE/.netlify/git/settings")"
          echo "Git Gateway settings probe -> HTTP $git_code"
          cat /tmp/git-settings || true
          test "$git_code" != '404'

          echo 'Production CMS authentication dependencies are reachable.'
