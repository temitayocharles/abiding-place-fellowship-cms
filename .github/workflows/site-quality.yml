name: Site quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify delivery artifacts
        run: |
          test -f public/admin/index.html
          test -f public/admin/config.yml
          test -f public/admin/help.html
          test -f public/content/site-data.json
          grep -q 'abidingplace.netlify.app' public/admin/config.yml
          grep -q 'Current Announcements' public/events.html || true
      - name: Report Netlify credential readiness
        if: github.event_name == 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          TOKEN="${NETLIFY_AUTH_TOKEN:-$NETLIFY_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::No NETLIFY_AUTH_TOKEN or NETLIFY_TOKEN repository secret is configured; canonical deployment will be skipped."
          else
            echo "A masked Netlify deployment credential is available."
          fi
