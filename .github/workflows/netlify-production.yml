name: Netlify production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: abidingplace-netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      NETLIFY_SITE_ID: 85526be1-1a57-48eb-a6ec-795115effb8b
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify production artifacts
        run: |
          test -f public/index.html
          test -f public/admin/index.html
          test -f public/admin/config.yml
          test -f public/admin/help.html
          test -f public/manage.html
          test ! -f public/admin.html
          test -f public/content/site-data.json
          test -f public/_headers
          test -f public/_redirects
      - name: Resolve deployment credential
        id: auth
        run: |
          TOKEN="${NETLIFY_AUTH_TOKEN:-$NETLIFY_TOKEN}"
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Canonical Netlify deployment skipped because no production environment deployment token is configured."
          fi
      - name: Deploy canonical site to Netlify
        if: steps.auth.outputs.available == 'true'
        run: |
          TOKEN="${NETLIFY_AUTH_TOKEN:-$NETLIFY_TOKEN}"
          npx --yes netlify-cli@latest deploy \
            --dir=public \
            --prod \
            --site="$NETLIFY_SITE_ID" \
            --auth="$TOKEN" \
            --message="GitHub ${GITHUB_SHA}" \
            --json > /tmp/netlify-production.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/netlify-production.json', 'utf8'));
          const url = String(result.deploy_ssl_url || result.deploy_url || result.site_url || result.url || '')
            .replace(/^http:/, 'https:')
            .replace(/\/$/, '');
          if (!url) throw new Error('Netlify did not return a production URL');
          fs.appendFileSync(process.env.GITHUB_ENV, `PRODUCTION_URL=${url}\n`);
          console.log(`Canonical production deploy: ${url}`);
          NODE
      - name: Verify canonical production delivery
        if: steps.auth.outputs.available == 'true'
        run: |
          set -euo pipefail
          for path in / /admin/ /admin/help.html /manage.html /admin/config.yml /content/site-data.json; do
            code="$(curl --retry 10 --retry-delay 2 --retry-all-errors -sS -L -o /tmp/production-body -w '%{http_code}' "$PRODUCTION_URL$path")"
            echo "$path -> HTTP $code"
            test "$code" = "200"
            test -s /tmp/production-body
          done

          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSI "$PRODUCTION_URL/admin/" | tr -d '\r' > /tmp/admin.headers
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSI "$PRODUCTION_URL/" | tr -d '\r' > /tmp/home.headers
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSI "$PRODUCTION_URL/admin/config.yml" | tr -d '\r' > /tmp/config.headers

          grep -qi '^x-robots-tag:.*noindex' /tmp/admin.headers
          grep -qi '^x-content-type-options: *nosniff' /tmp/home.headers
          grep -Eqi '^cache-control:.*(no-store|no-cache)' /tmp/config.headers
