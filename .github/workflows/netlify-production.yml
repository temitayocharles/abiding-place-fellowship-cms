name: Netlify delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: abidingplace-netlify-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify preview artifacts
        run: |
          test -f public/index.html
          test -f public/admin/index.html
          test -f public/admin/config.yml
          test -f public/admin/help.html
          test -f public/content/site-data.json
      - name: Create temporary live Netlify preview
        run: |
          npx --yes netlify-cli@latest deploy \
            --allow-anonymous \
            --dir=public \
            --json > /tmp/netlify-preview.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/netlify-preview.json', 'utf8'));
          const preferredKeys = [
            'deploy_ssl_url', 'deploy_url', 'deployUrl', 'deployURL',
            'ssl_url', 'sslUrl', 'site_url', 'siteUrl', 'url'
          ];
          let url;
          for (const key of preferredKeys) {
            if (typeof result[key] === 'string' && result[key].includes('netlify')) {
              url = result[key];
              break;
            }
          }
          function inspect(value) {
            if (url) return;
            if (typeof value === 'string' && /^https?:\/\//.test(value) && value.includes('netlify')) {
              url = value;
              return;
            }
            if (Array.isArray(value)) value.forEach(inspect);
            else if (value && typeof value === 'object') Object.values(value).forEach(inspect);
          }
          inspect(result);
          if (!url) {
            console.log(`Netlify response keys: ${Object.keys(result).join(', ')}`);
            throw new Error('Netlify created the preview but did not return a discoverable URL');
          }
          console.log(`Temporary preview URL: ${url}`);
          console.log('This anonymous preview expires unless claimed; it is used only for delivery validation.');
          NODE

  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_SITE_ID: 85526be1-1a57-48eb-a6ec-795115effb8b
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify production artifacts
        run: |
          test -f public/index.html
          test -f public/admin/index.html
          test -f public/admin/config.yml
          test -f public/admin/help.html
          test -f public/content/site-data.json
      - name: Resolve deployment credential
        id: auth
        run: |
          TOKEN="${NETLIFY_AUTH_TOKEN:-$NETLIFY_TOKEN}"
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Canonical Netlify deployment skipped because no repository deployment token is configured."
          fi
      - name: Deploy canonical site to Netlify
        if: steps.auth.outputs.available == 'true'
        run: |
          TOKEN="${NETLIFY_AUTH_TOKEN:-$NETLIFY_TOKEN}"
          npx --yes netlify-cli@latest deploy \
            --dir=public \
            --prod \
            --site="$NETLIFY_SITE_ID" \
            --auth="$TOKEN" \
            --message="GitHub ${GITHUB_SHA}"
